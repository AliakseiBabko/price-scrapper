l="#333" font-weight="bold">2825.1  в чистоте</text><line x1="268.24" y1="868.00" x2="294.24" y2="868.00" stroke="#b03030" stroke-width="0.8"/><line x1="268.24" y1="118.00" x2="294.24" y2="118.00" stroke="#b03030" stroke-width="0.8"/><line x1="281.24" y1="868.00" x2="281.24" y2="118.00" stroke="#b03030" stroke-width="0.9" marker-start="url(#a)" marker-end="url(#a)"/><text x="277.24" y="493.00" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b03030" font-weight="bold" transform="rotate(-90 277.24 493.00)">2500</text><line x1="326.24" y1="197.50" x2="1173.76" y2="197.50" stroke="#a11" stroke-width="0.90" stroke-dasharray="6,4"/><line x1="1205.76" y1="197.50" x2="1231.76" y2="197.50" stroke="#b03030" stroke-width="0.8"/><line x1="1205.76" y1="118.00" x2="1231.76" y2="118.00" stroke="#b03030" stroke-width="0.8"/><line x1="1218.76" y1="197.50" x2="1218.76" y2="118.00" stroke="#b03030" stroke-width="0.9" marker-start="url(#a)" marker-end="url(#a)"/><text x="1214.76" y="157.75" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b03030" font-weight="bold" transform="rotate(-90 1214.76 157.75)">265</text><text x="1240.76" y="157.75" font-family="Segoe UI,Arial,sans-serif" font-size="10" text-anchor="start" fill="#a11" font-weight="normal">над проёмом — зона перемычки</text><line x1="628.26" y1="868.00" x2="654.26" y2="868.00" stroke="#b03030" stroke-width="0.8"/><line x1="628.26" y1="647.50" x2="654.26" y2="647.50" stroke="#b03030" stroke-width="0.8"/><line x1="641.26" y1="868.00" x2="641.26" y2="647.50" stroke="#b03030" stroke-width="0.9" marker-start="url(#a)" marker-end="url(#a)"/><text x="637.26" y="757.75" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle" fill="#b03030" font-weight="bold" transform="rotate(-90 637.26 757.75)">735</text><text x="28.0" y="1012.0" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#333">Скомпилировано из ResolvedGeometry (25 walls). Ни одна координата здесь не набрана руками.</text><text x="28.0" y="1027.0" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#333">ЦЕПЬ ЗАКРЫВАЕТСЯ: 1120.1 + 1380.0 + 325.0 = 2825.1 мм в чистоте.</text><text x="28.0" y="1042.0" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#333">ВОСТОК: 150 мм газоблока, затем 175 мм монолита R8 — рама, расширение на восток упирается в неё.</text><text x="28.0" y="1057.0" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#333">ЗАПАД: 1120.1 мм, целиком MA — газоблок 300, «не несущие» по описанию застройщика.</text><text x="28.0" y="1072.0" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#333">!! Радиатор в модели ОТСУТСТВУЕТ. Показан как неизмеренная зона, не как объект.</text><text x="28.0" y="1087.0" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#333">!! Окно выходит НА ЛОДЖИЮ, не на улицу. MA — тепловая граница квартиры.</text><text x="28.0" y="1102.0" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#333">!! Над проёмом до потолка остаётся 265 мм. Это зона перемычки — какую перемычку она несёт, модель НЕ знает, это расчёт конструктора.</text></svg>